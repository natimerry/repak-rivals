name: Upload Release to Nexus Mods

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for an existing GitHub release
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-to-nexus:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}

    steps:
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NEXUS_API_KEY:-}" ]; then
            echo "Missing required secret: NEXUSMODS_API_KEY" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi

          release_json="$(gh api \
            "repos/${{ github.repository }}/releases/tags/${tag}")"

          release_url="$(jq -r '.html_url' <<<"${release_json}")"
          version="${tag#v}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "release_url=${release_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p incoming

          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir incoming \
            --pattern 'repak-gui-*-pc-windows-msvc.zip' \
            --pattern 'repak-gui-*-unknown-linux-gnu.tar.xz'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zip

      - name: Normalize archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p prepared

          windows_asset="incoming/repak-gui-x86_64-pc-windows-msvc.zip"
          linux_asset="incoming/repak-gui-x86_64-unknown-linux-gnu.tar.xz"

          if [ ! -f "${windows_asset}" ]; then
            echo "Missing Windows release asset" >&2
            exit 1
          fi

          if [ ! -f "${linux_asset}" ]; then
            echo "Missing Linux release asset" >&2
            exit 1
          fi

          cp "${windows_asset}" \
            "prepared/repak-gui-x86_64-pc-windows-msvc.zip"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "${temp_dir}"' EXIT

          bsdtar -xf "${linux_asset}" -C "${temp_dir}"

          if ! find "${temp_dir}" -mindepth 1 -print -quit | grep -q .; then
            echo "Linux archive extracted no files" >&2
            exit 1
          fi

          (
            cd "${temp_dir}"
            zip -rq \
              "${GITHUB_WORKSPACE}/prepared/repak-gui-x86_64-unknown-linux-gnu.zip" \
              .
          )

      - name: Upload Windows build to Nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}

          # NEW MOD FILE ID — NOT THE OLD UPDATE GROUP ID
          file_id: ${{ vars.NEXUS_WINDOWS_FILE_ID }}

          filename: prepared/repak-gui-x86_64-pc-windows-msvc.zip
          display_name: repak-gui-x86_64-pc-windows-msvc
          version: ${{ steps.release.outputs.version }}

          description: >-
            GitHub release ${{ steps.release.outputs.tag }}:
            ${{ steps.release.outputs.release_url }}

          category: ${{ vars.NEXUS_FILE_CATEGORY || 'main' }}
          archive_existing_version: false

      - name: Upload Linux build to Nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.9
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}

          # NEW MOD FILE ID — NOT THE OLD UPDATE GROUP ID
          file_id: ${{ vars.NEXUS_LINUX_FILE_ID }}

          filename: prepared/repak-gui-x86_64-unknown-linux-gnu.zip
          display_name: repak-gui-x86_64-unknown-linux-gnu
          version: ${{ steps.release.outputs.version }}

          description: >-
            GitHub release ${{ steps.release.outputs.tag }}:
            ${{ steps.release.outputs.release_url }}

          category: ${{ vars.NEXUS_FILE_CATEGORY || 'main' }}
          archive_existing_version: false
